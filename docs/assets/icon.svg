<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="iconLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" fill="url(#iconBg)" rx="24"/>
  
  <!-- Camera body -->
  <rect x="24" y="38" width="80" height="56" rx="12" fill="#1E1B4B"/>
  
  <!-- Camera top bump -->
  <rect x="40" y="30" width="26" height="14" rx="5" fill="#1E1B4B"/>
  
  <!-- Lens outer -->
  <circle cx="64" cy="66" r="20" fill="#4F46E5"/>
  <circle cx="64" cy="66" r="15" fill="#1E1B4B"/>
  
  <!-- Lens inner -->
  <circle cx="64" cy="66" r="10" fill="url(#iconLens)"/>
  <circle cx="64" cy="66" r="5" fill="#C7D2FE"/>
  
  <!-- Shine -->
  <circle cx="59" cy="61" r="2.5" fill="white" opacity="0.7"/>
  
  <!-- Flash -->
  <rect x="88" y="42" width="8" height="6" rx="2" fill="#FBBF24"/>
  
  <!-- Smile -->
  <path d="M50 82 Q64 92 78 82" stroke="#C7D2FE" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
