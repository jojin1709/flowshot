<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)"/>
  
  <!-- Flow lines (motion feel) -->
  <path d="M20 70 Q60 50 100 70 Q140 90 180 70" stroke="#A5B4FC" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M20 100 Q60 80 100 100 Q140 120 180 100" stroke="#818CF8" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M20 130 Q60 110 100 130 Q140 150 180 130" stroke="#A5B4FC" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Camera body -->
  <rect x="45" y="65" width="110" height="75" rx="16" fill="url(#lens)"/>
  
  <!-- Camera top bump -->
  <rect x="65" y="55" width="35" height="18" rx="6" fill="#3730A3"/>
  
  <!-- Lens outer ring -->
  <circle cx="100" cy="102" r="28" fill="#1E1B4B"/>
  <circle cx="100" cy="102" r="24" fill="url(#glow)"/>
  <circle cx="100" cy="102" r="18" fill="#1E1B4B"/>
  
  <!-- Lens inner glow -->
  <circle cx="100" cy="102" r="12" fill="#4F46E5"/>
  <circle cx="100" cy="102" r="6" fill="#C7D2FE"/>
  
  <!-- Shine dot -->
  <circle cx="93" cy="95" r="3" fill="white" opacity="0.7"/>
  
  <!-- Flash -->
  <rect x="128" y="70" width="12" height="8" rx="2" fill="#FBBF24"/>
  
  <!-- Smile -->
  <path d="M85 120 Q100 132 115 120" stroke="#C7D2FE" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Motion sparkles -->
  <circle cx="30" cy="85" r="3" fill="#818CF8" opacity="0.6"/>
  <circle cx="170" cy="85" r="3" fill="#818CF8" opacity="0.6"/>
  <circle cx="35" cy="115" r="2" fill="#A5B4FC" opacity="0.5"/>
  <circle cx="165" cy="115" r="2" fill="#A5B4FC" opacity="0.5"/>
</svg>
